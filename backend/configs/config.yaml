application:
  name: "AI Memory Forensic Investigation Assistant"
  version: "1.0.0"
  environment: "development"

server:
  host: "127.0.0.1"
  port: 8000

database:
  path: "storage/database/fia.db"

vector_database:
  path: "storage/vectors"

ollama:
  base_url: "http://localhost:11434"
  model: "llama3.2"

logging:
  level: "INFO"
  config_path: "configs/logging.yaml"

reporting:
  output_directory: "storage/reports"
